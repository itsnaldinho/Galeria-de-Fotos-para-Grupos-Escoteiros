<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<style>
:root{--bg:#07202c;--bg2:#0b2b3b;--bd:#1b4458;--gold:#f0c24b;--tx:#eef4f7;--mut:#8fb0c0}
*{box-sizing:border-box;margin:0}
body{font-family:Montserrat,system-ui,Arial,sans-serif;background:#f3f5f7;color:#12303f}
button,select,input{font:inherit}
.app{display:flex;min-height:100vh}
aside{width:290px;background:var(--bg);color:var(--tx);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
aside h1{font-size:17px;margin:0 6px 4px;display:flex;gap:8px;align-items:center}
aside small{color:var(--mut);margin:0 6px 16px;display:block}
details{border-bottom:1px solid var(--bd)}
summary{padding:12px 8px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;list-style:none}
summary::-webkit-details-marker{display:none}
summary span{color:var(--mut);font-weight:500;font-size:12px}
.side-all{padding:12px 8px;cursor:pointer;font-weight:700;border-bottom:1px solid var(--bd)}
.mini{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;cursor:pointer;font-size:13px}
.mini:hover,.mini.on{background:var(--bg2)}
.mini img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#1b4458;flex-shrink:0}
main{flex:1;min-width:0}
.head{padding:26px 28px 8px}
.head h2{font-size:26px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;padding:12px 28px 18px}
.ctl input,.ctl select{padding:10px 12px;border:1px solid #cdd8de;border-radius:8px;background:#fff}
.ctl input{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:0 28px 40px}
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 10px #0001;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px #0002}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#d9e3e8}
.card div{padding:12px 14px}.card b{display:block}.card small{color:#5f7c8a}
.hero{position:relative;min-height:240px;background:#0b2b3b center/cover;color:#fff;display:flex;align-items:flex-end}
.hero:before{content:"";position:absolute;inset:0;backdrop-filter:blur(14px);background:linear-gradient(#0003,#07202cdd)}
.hero div{position:relative;padding:24px 28px}
.hero h2{font-size:30px}.hero p{margin-top:8px;opacity:.9;font-size:14px}
.back{background:#ffffff22;border:0;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;margin-bottom:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg2);color:var(--tx);padding:10px 28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.bar select,.bar button{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700}
.bar option{color:#000}
.bar button.on{color:var(--gold);border-color:var(--gold)}
.bar .gold{background:var(--gold);color:#12303f;border-color:var(--gold)}
.grid{display:grid;gap:3px;padding:3px;grid-template-columns:repeat(var(--c),1fr)}
.ph{position:relative;aspect-ratio:3/2;overflow:hidden;cursor:pointer;background:#dfe7eb}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
.ph:hover img{transform:scale(1.05)}
.ph .hrt{position:absolute;right:6px;bottom:6px;background:#0008;color:#fff;border:0;border-radius:50%;width:30px;height:30px;cursor:pointer;opacity:0;transition:.2s}
.ph:hover .hrt,.ph .hrt.on{opacity:1}.hrt.on{color:#ff5a7a}
.msg{padding:50px;text-align:center;color:#5f7c8a}
/* lightbox */
#lb{position:fixed;inset:0;background:#fff;z-index:50;display:none}
#lb.show{display:block}
#lb .stage{position:absolute;inset:0 110px 0 0;display:flex;align-items:center;justify-content:center;padding:14px 70px}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 4px 30px #0003}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:46px;background:none;border:0;cursor:pointer;color:#12303f;padding:10px}
#lb .prev{left:10px}#lb .next{right:120px}
#lb .info{position:absolute;left:18px;top:16px;font-size:14px;font-weight:700;max-width:180px}
#lb .info small{display:block;font-weight:500;color:#5f7c8a;margin-top:4px}
#lb .strip{position:absolute;right:0;top:0;bottom:0;width:104px;overflow:auto;padding:70px 10px 10px;background:#fff}
#lb .strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
#lb .strip img.on{border-color:#12303f}
#lb .x{position:absolute;right:20px;top:14px;width:44px;height:44px;border-radius:50%;border:0;background:#eef2f4;font-size:20px;cursor:pointer;z-index:3}
#lb .acts{position:absolute;right:124px;top:50%;transform:translateY(-50%);background:#fff;border-radius:14px;box-shadow:0 2px 14px #0003;padding:8px;display:flex;flex-direction:column;gap:8px}
#lb .acts button{width:46px;height:46px;border-radius:50%;border:0;background:#eef2f4;cursor:pointer;font-size:18px}
#lb .acts .dl{background:#0b2b3b;color:#fff}
#lb .acts .on{color:#ff5a7a}
#lb .cnt{position:absolute;right:124px;bottom:14px;background:#0003;color:#fff;font-size:12px;padding:5px 10px;border-radius:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#12303f;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;display:none}
@media(max-width:800px){
 .app{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:45vh}
 .head,.ctl{padding-left:14px;padding-right:14px}.cards{padding:0 14px 30px}.bar{padding:10px 14px}
 .grid{grid-template-columns:repeat(min(var(--c),3),1fr)}
 #lb .stage{inset:0 0 70px 0;padding:60px 6px 6px}
 #lb .strip{display:none}
 #lb .acts{right:0;left:0;top:auto;bottom:0;transform:none;flex-direction:row;justify-content:center;border-radius:0}
 #lb .next{right:0}#lb .cnt{right:10px;bottom:80px}#lb .info{display:none}
}
.play{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>⚜ Galeria do DNM</h1><small>Escolha o ano e o evento</small>
    <div id="side"></div>
  </aside>
  <main id="main"><div class="msg">Carregando álbuns...</div></main>
</div>

<div id="lb">
  <div class="info" id="lbInfo"></div>
  <button class="x" onclick="closeLb()">✕</button>
  <button class="nav prev" onclick="step(-1)">‹</button>
  <div class="stage">
    <img id="lbImg" alt="">
    <iframe id="lbVid" allow="autoplay; fullscreen" allowfullscreen style="display:none;width:100%;height:100%;border:0;background:#000"></iframe>
  </div>
  <button class="nav next" onclick="step(1)">›</button>
  <div class="acts">
    <button id="bFav" title="Favoritar" onclick="toggleFav(view[idx][0])">♡</button>
    <button title="WhatsApp" onclick="zap(view[idx][0])">🟢</button>
    <button title="Copiar link" onclick="copyLink(view[idx][0])">🔗</button>
    <button class="dl" title="Baixar" onclick="baixar(view[idx][0])">⬇</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="cnt" id="lbCnt"></div>
</div>
<div id="toast"></div>

<script>
const BASE = "<?!= baseUrl ?>";
const PARAMS = <?!= params ?>;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const th = (id, w) => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w;
const run = (fn, ...a) => new Promise((ok, err) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => err(e))[fn](...a));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return new Date(y, m - 1, dd).toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'}); };

let albums = [], yearSel = 'all', sortAlb = 'data-desc', q = '';
let cur = null, fotos = [], view = [], idx = 0;
let cols = store.get('cols', 6), sortFt = 'data-asc', onlyFav = false, favs = new Set(), tipo = 'all';

function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2200); }

/* ---------- Home / álbuns ---------- */
async function init() {
  try { albums = await run('getAlbuns'); } catch (e) { $('#main').innerHTML = '<div class="msg">Erro ao carregar: ' + esc(e.message) + '</div>'; return; }
  renderSide();
  if (PARAMS.album && albums.find(a => a.id === PARAMS.album)) openAlbum(PARAMS.album, PARAMS.foto);
  else renderHome();
}

function renderSide() {
  const years = [...new Set(albums.map(a => a.ano))].sort().reverse();
  let h = '<div class="side-all" onclick="setYear(\'all\')">📚 Todos os anos</div>';
  years.forEach(y => {
    const list = albums.filter(a => a.ano === y).sort((a, b) => b.data.localeCompare(a.data));
    h += `<details><summary onclick="setYear('${y}',true)">${y}<span>${list.length} álbuns</span></summary>` +
      list.map(a => `<div class="mini" data-id="${a.id}" onclick="openAlbum('${a.id}')">
        <img loading="lazy" src="${th(a.capaId, 120)}"><div><b>${esc(a.titulo)}</b></div></div>`).join('') + '</details>';
  });
  $('#side').innerHTML = h;
}

function setYear(y, fromSummary) { yearSel = y; cur = null; renderHome(); }

function renderHome() {
  cur = null;
  let list = albums.filter(a => (yearSel === 'all' || a.ano === yearSel) &&
    (a.titulo + ' ' + a.local).toLowerCase().includes(q.toLowerCase()));
  const s = {
    'data-desc': (a, b) => b.data.localeCompare(a.data),
    'data-asc': (a, b) => a.data.localeCompare(b.data),
    'az': (a, b) => a.titulo.localeCompare(b.titulo, 'pt'),
    'za': (a, b) => b.titulo.localeCompare(a.titulo, 'pt')
  }[sortAlb];
  list.sort(s);
  $('#main').innerHTML = `
    <div class="head"><h2>${yearSel === 'all' ? 'Todos os álbuns' : 'Álbuns de ' + yearSel}</h2></div>
    <div class="ctl">
      <input id="qBox" placeholder="Buscar evento ou local..." value="${esc(q)}">
      <select id="sAlb">
        <option value="data-desc">Mais recentes</option><option value="data-asc">Mais antigos</option>
        <option value="az">A → Z</option><option value="za">Z → A</option>
      </select>
    </div>
    <div class="cards">${list.map(a => `
      <div class="card" onclick="openAlbum('${a.id}')">
        <img loading="lazy" src="${th(a.capaId, 500)}">
        <div><b>${esc(a.titulo)}</b><small>📍 ${esc(a.local || '—')} · ${fmtDate(a.data)}<br>🖼 ${a.fotos} fotos</small></div>
      </div>`).join('') || '<div class="msg">Nenhum álbum encontrado.</div>'}</div>`;
  $('#sAlb').value = sortAlb;
  $('#sAlb').onchange = e => { sortAlb = e.target.value; renderHome(); };
  $('#qBox').oninput = e => { q = e.target.value; clearTimeout(window._t); window._t = setTimeout(() => { renderHome(); const b = $('#qBox'); b.focus(); b.setSelectionRange(q.length, q.length); }, 250); };
}

/* ---------- Álbum ---------- */
async function openAlbum(id, fotoId) {
  $('#main').innerHTML = '<div class="msg">Carregando fotos...</div>';
  document.querySelectorAll('.mini').forEach(m => m.classList.toggle('on', m.dataset.id === id));
  try {
    const r = await run('getFotos', id);
    cur = r.album; fotos = r.fotos;
  } catch (e) { $('#main').innerHTML = '<div class="msg">Erro: ' + esc(e.message) + '</div>'; return; }
  favs = new Set(store.get('fav:' + id, []));
  onlyFav = false;
  renderAlbum();
  if (fotoId) { const i = view.findIndex(f => f[0] === fotoId); if (i >= 0) openLb(i); }
  scrollTo(0, 0);
}

function applyView() {
  let v = fotos.slice();
    if (tipo === 'foto') v = v.filter(f => f[3] !== 1);
  if (tipo === 'video') v = v.filter(f => f[3] === 1);
  if (onlyFav) v = v.filter(f => favs.has(f[0]));
  if (sortFt === 'data-desc') v.reverse();
  else if (sortFt === 'az') v.sort((a, b) => a[1].localeCompare(b[1], 'pt', {numeric: true}));
  else if (sortFt === 'za') v.sort((a, b) => b[1].localeCompare(a[1], 'pt', {numeric: true}));
  view = v;
}

function renderAlbum() {
  applyView();
  const w = cols <= 4 ? 700 : cols <= 6 ? 450 : 300;
  $('#main').innerHTML = `
    <div class="hero" style="background-image:url(${th(cur.capaId, 1200)})"><div>
      <button class="back" onclick="renderHome()">← Álbuns</button>
      <h2>${esc(cur.titulo)}</h2>
      <p>📍 ${esc(cur.local || '—')} &nbsp;|&nbsp; 📅 ${fmtDate(cur.data)} &nbsp;|&nbsp; 🖼 ${fotos.filter(f => f[3] !== 1).length} fotos · 🎬 ${fotos.filter(f => f[3] === 1).length} vídeos</p>
    </div></div>
    <div class="bar">
      <select id="sFt"><option value="data-asc">Data ↑</option><option value="data-desc">Data ↓</option><option value="az">Nome A→Z</option><option value="za">Nome Z→A</option></select>
      <select id="sCols">${[3,4,5,6,7,8].map(n => `<option value="${n}">Grade ${n} col</option>`).join('')}</select>
      <select id="sTipo"><option value="all">Fotos e vídeos</option><option value="foto">Só fotos</option><option value="video">Só vídeos</option></select>
      <button id="bOnly" class="${onlyFav ? 'on' : ''}">♡ Favoritas (${favs.size})</button>
      <span class="sp"></span>
      <button onclick="zap()">WhatsApp</button>
      <button class="gold" onclick="copyLink()">Copiar link</button>
    </div>
    <div class="grid" style="--c:${cols}">${view.map((f, i) => `
      <div class="ph" onclick="openLb(${i})">
        <img loading="lazy" src="${th(f[0], w)}" alt="${esc(f[1])}">
        ${f[3] === 1 ? '<span class="play">▶ Vídeo</span>' : ''}
        <button class="hrt ${favs.has(f[0]) ? 'on' : ''}" onclick="event.stopPropagation();toggleFav('${f[0]}')">${favs.has(f[0]) ? '♥' : '♡'}</button>
      </div>`).join('') || '<div class="msg" style="grid-column:1/-1">Nenhuma foto.</div>'}</div>`;
  $('#sFt').value = sortFt; $('#sCols').value = cols;
  $('#sTipo').value = tipo;
  $('#sTipo').onchange = e => { tipo = e.target.value; renderAlbum(); };
  $('#sFt').onchange = e => { sortFt = e.target.value; renderAlbum(); };
  $('#sCols').onchange = e => { cols = +e.target.value; store.set('cols', cols); renderAlbum(); };
  $('#bOnly').onclick = () => { onlyFav = !onlyFav; renderAlbum(); };
}

/* ---------- Ações ---------- */
function linkFoto(id) { return BASE + '?album=' + cur.id + (id ? '&foto=' + id : ''); }
function copyLink(id) {
  const t = linkFoto(id);
  const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('Link copiado!'); } catch (e) { prompt('Copie o link:', t); } a.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Link copiado!'), fb); else fb();
}
function zap(id) { window.open('https://wa.me/?text=' + encodeURIComponent(cur.titulo + ' - ' + linkFoto(id)), '_blank'); }
function baixar(id) { window.open('https://drive.google.com/uc?export=download&id=' + id, '_blank'); }
function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set('fav:' + cur.id, [...favs]);
  const lbOpen = $('#lb').classList.contains('show');
  if (lbOpen) { updFav(); document.querySelectorAll('.ph').forEach((p, i) => { const b = p.querySelector('.hrt'); const on = favs.has(view[i][0]); b.classList.toggle('on', on); b.textContent = on ? '♥' : '♡'; }); }
  else renderAlbum();
}
function updFav() { const on = favs.has(view[idx][0]); $('#bFav').textContent = on ? '♥' : '♡'; $('#bFav').classList.toggle('on', on); }

/* ---------- Lightbox ---------- */
function openLb(i) { idx = i; $('#lb').classList.add('show'); document.body.style.overflow = 'hidden'; showPhoto(); }

function closeLb() {
  $('#lb').classList.remove('show'); document.body.style.overflow = '';
  $('#lbVid').src = 'about:blank';
  if (onlyFav) renderAlbum();
}
function showPhoto() {
  const f = view[idx], isV = f[3] === 1;
  const img = $('#lbImg'), vid = $('#lbVid');
  img.style.display = isV ? 'none' : 'block';
  vid.style.display = isV ? 'block' : 'none';
  if (isV) {
    vid.src = 'https://drive.google.com/file/d/' + f[0] + '/preview';
  } else {
    vid.src = 'about:blank';
    img.style.opacity = .4; img.onload = () => img.style.opacity = 1;
    img.src = th(f[0], 2400);
  }
  $('#lbInfo').innerHTML = esc(cur.titulo) + '<small>' + esc(cur.local) + '<br>' + fmtDate(cur.data) + '</small>';
  $('#lbCnt').textContent = (idx + 1) + ' / ' + view.length;
  updFav();
  const a = Math.max(0, idx - 12), b = Math.min(view.length, idx + 13);
  $('#strip').innerHTML = view.slice(a, b).map((x, k) => `<img class="${a + k === idx ? 'on' : ''}" src="${th(x[0], 160)}" onclick="idx=${a + k};showPhoto()">`).join('');
  [idx + 1, idx - 1].forEach(j => { if (view[j] && view[j][3] !== 1) new Image().src = th(view[j][0], 2400); });
}

function step(d) { idx = (idx + d + view.length) % view.length; showPhoto(); }

document.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('show')) return;
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') closeLb();
});
let tx = 0; $('#lb').addEventListener('touchstart', e => tx = e.touches[0].clientX);
$('#lb').addEventListener('touchend', e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 60) step(d < 0 ? 1 : -1); });

init();
</script>
</body>
</html>
